<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo</title>
<!--
  Janela web escondida do app do dono: recebe a imagem escolhida na galeria,
  passa pelo mesmo tratamento do site (processa.js) e devolve as fontes pra o
  app enquadrar (arrastar e aproximar, desenhado no próprio app). No fim, o
  app pede o PNG final com o zoom e a posição escolhidos.
  Mensagens:
    app → { b64, tipo }                         página → { evento: 'fontes', forma, foto, fundoLiso, transparente }
    app → { acao: 'compor', modo, zoom, dx, dy } página → { evento: 'composto', url }
    página → { evento: 'pronta' } ao abrir · { evento: 'erro' } se a imagem não abrir
  forma/foto: { url, w, h } (forma é null quando não há fundo que dê pra tirar).
  O app chama window.loovLogoReceber(msg) direto (injectJavaScript), que é igual
  no Android e no iPhone; o evento 'message' fica como segunda via.
-->
<script src="/logo/processa.js"></script>
</head>
<body>
<script>
(function () {
  var prep = null;
  function responder(o) {
    var s = JSON.stringify(o);
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(s);
    else if (window.parent !== window) window.parent.postMessage(s, '*');
  }
  function fonte(cv, tipo) { return cv ? { url: cv.toDataURL(tipo, 0.92), w: cv.width, h: cv.height } : null; }
  function receber(dado) {
    var msg;
    try { msg = typeof dado === 'string' ? JSON.parse(dado) : dado; } catch (e) { return; }
    if (!msg) return;
    var P = window.LoovLogoProcessa;
    if (!P) return responder({ evento: 'erro', etapa: 'script' });
    if (msg.acao === 'compor') {
      if (!prep) return responder({ evento: 'erro', etapa: 'compor' });
      var modo = msg.modo === 'forma' && prep.forma ? 'forma' : 'foto';
      var r = P.compor(modo === 'forma' ? prep.forma : prep.foto, modo, msg.zoom || 1, msg.dx || 0, msg.dy || 0);
      return responder({ evento: 'composto', url: r.canvas.toDataURL('image/png') });
    }
    if (!msg.b64) return;
    var img = new Image();
    img.onload = function () {
      try {
        prep = P.preparar(img);
        responder({
          evento: 'fontes',
          // A forma guarda a transparência (PNG); a foto vai em JPEG, mais leve.
          forma: fonte(prep.forma, 'image/png'),
          foto: fonte(prep.foto, 'image/jpeg'),
          fundoLiso: prep.fundoLiso,
          transparente: prep.transparente
        });
      } catch (e) { responder({ evento: 'erro', etapa: 'tratamento' }); }
    };
    img.onerror = function () { responder({ evento: 'erro', etapa: 'imagem' }); };
    img.src = 'data:' + (msg.tipo || 'image/jpeg') + ';base64,' + msg.b64;
  }
  window.loovLogoReceber = receber;
  // Android entrega em document, iOS em window.
  window.addEventListener('message', function (e) { receber(e.data); });
  document.addEventListener('message', function (e) { receber(e.data); });
  responder({ evento: 'pronta' });
})();
</script>
</body>
</html>
