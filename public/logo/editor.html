<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo</title>
<!--
  Janela web escondida do app do dono: recebe a imagem escolhida na galeria,
  passa pelo mesmo tratamento do site (processa.js) e devolve os PNGs prontos.
  Mensagens: app → { b64, tipo } · página → { evento: 'pronta' } e
  { evento: 'resultado', forma, foto, fundoLiso, transparente } ou { evento: 'erro' }.
-->
<script src="/logo/processa.js"></script>
</head>
<body>
<script>
(function () {
  function responder(o) {
    var s = JSON.stringify(o);
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(s);
    else if (window.parent !== window) window.parent.postMessage(s, '*');
  }
  function receber(dado) {
    var msg;
    try { msg = typeof dado === 'string' ? JSON.parse(dado) : dado; } catch (e) { return; }
    if (!msg || !msg.b64) return;
    var img = new Image();
    img.onload = function () {
      try {
        var P = window.LoovLogoProcessa, p = P.preparar(img);
        responder({
          evento: 'resultado',
          forma: p.forma ? P.compor(p.forma, 'forma', 1, 0, 0).canvas.toDataURL('image/png') : null,
          foto: P.compor(p.foto, 'foto', 1, 0, 0).canvas.toDataURL('image/png'),
          fundoLiso: p.fundoLiso,
          transparente: p.transparente
        });
      } catch (e) { responder({ evento: 'erro' }); }
    };
    img.onerror = function () { responder({ evento: 'erro' }); };
    img.src = 'data:' + (msg.tipo || 'image/jpeg') + ';base64,' + msg.b64;
  }
  // Android entrega em document, iOS em window.
  window.addEventListener('message', function (e) { receber(e.data); });
  document.addEventListener('message', function (e) { receber(e.data); });
  responder({ evento: 'pronta' });
})();
</script>
</body>
</html>
